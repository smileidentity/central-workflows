name: Check shared PR workflows

on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report stale PR changes without adding labels or comments
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    if: github.event_name == 'pull_request_target'
    uses: smileidentity/central-workflows/.github/workflows/auto-author-assign.yml@e04941c6757ab31f0e5de5195a264530e8c373d0 # same commit as the distributed callers
  stale:
    if: github.event_name != 'pull_request_target'
    uses: smileidentity/central-workflows/.github/workflows/stale.yml@e04941c6757ab31f0e5de5195a264530e8c373d0 # same commit as the distributed callers
    with:
      dry-run: ${{ inputs.dry-run || false }}
