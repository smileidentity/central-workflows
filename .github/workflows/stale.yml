name: Flag stale PRs

on:
  workflow_call:
    inputs:
      dry-run:
        description: Report changes without adding labels or comments
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale-prs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 14
          days-before-close: -1
          stale-pr-label: stale
          stale-pr-message: 'This PR has had no activity for 14 days. Comment or update it to remove the stale label. It will not be closed automatically.'
          remove-issue-stale-when-updated: false
          remove-pr-stale-when-updated: true
          debug-only: ${{ inputs.dry-run || false }}
