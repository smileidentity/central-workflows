name: Auto author assign

on:
  workflow_call:

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.event.pull_request && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only reads PR metadata. Never check out or execute pull request code here.
      - uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
